services:
  postgres:
    image: postgres:17
    container_name: petra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: petra
      POSTGRES_USER: petra
      POSTGRES_PASSWORD: ${PETRA_DB_PASSWORD:?set PETRA_DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - petra_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petra -d petra"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  petra_postgres_data:
