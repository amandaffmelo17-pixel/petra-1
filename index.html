<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515"><meta name="description" content="Porcelane — sistema operacional da marmoraria">
<link rel="manifest" href="manifest.webmanifest"><title>Porcelane — Gestão da Marmoraria</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--ink:#171717;--muted:#707070;--line:#e3e3df;--soft:#efefeb;--dark:#151515;--accent:#222}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{position:fixed;z-index:10;inset:0 auto 0 0;width:236px;background:var(--dark);color:#fff;padding:18px 12px;overflow:auto}.brand{padding:4px 10px 18px;border-bottom:1px solid #303030;margin-bottom:10px}.brand strong{font-size:22px;letter-spacing:-.05em}.brand small{display:block;color:#999;font-size:10px;margin-top:4px;text-transform:uppercase;letter-spacing:.1em}.group{margin-bottom:5px}.group-head{width:100%;border:0;background:none;color:#929292;text-align:left;text-transform:uppercase;font-size:10px;font-weight:750;letter-spacing:.08em;padding:9px 10px;display:flex;justify-content:space-between}.group.collapsed .group-items{display:none}.chev{transition:.15s}.collapsed .chev{transform:rotate(-90deg)}.group-items{display:grid;gap:2px}.nav-item{width:100%;border:0;background:none;color:#bbb;text-align:left;padding:9px 10px;border-radius:8px;font-size:13px}.nav-item:hover,.nav-item.active{background:#2a2a2a;color:#fff}.icon{display:inline-block;width:23px;color:#999}.main{margin-left:236px;width:calc(100% - 236px);padding:22px 30px 42px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.crumb{font-size:12px;color:var(--muted)}.company{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#222}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.title{font-size:30px;line-height:1.05;letter-spacing:-.045em;margin:0 0 5px}.subtitle{margin:0;color:var(--muted);font-size:14px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 12px;font-size:12px}.btn.primary{background:#171717;color:#fff;border-color:#171717}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.wide{grid-column:span 2}.full{grid-column:1/-1}.kpi-label,.table-head{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.kpi{font-size:29px;font-weight:750;letter-spacing:-.04em;margin-top:8px}.kpi-note{font-size:11px;color:var(--muted);margin-top:3px}.section-title{font-size:14px;margin:0 0 13px}.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stage{background:var(--soft);padding:12px;border-radius:9px}.stage b{display:block;font-size:19px}.stage span{font-size:10px;color:var(--muted)}.rows{display:grid}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.row:last-child{border-bottom:0}.badge{font-size:10px;background:var(--soft);padding:4px 7px;border-radius:999px;color:#555;white-space:nowrap}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.table th{font-size:10px;color:var(--muted);text-transform:uppercase}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:5px}.field label{font-size:11px;color:var(--muted)}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:90px}.notice{background:var(--soft);border-radius:9px;padding:12px;font-size:12px;margin-bottom:12px}.doc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.doc{border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}.doc b{font-size:12px}.doc p{font-size:11px;color:var(--muted);margin:6px 0 10px}.print-sheet{background:#fff;border:1px solid var(--line);max-width:800px;margin:auto;padding:42px;min-height:1050px}.print-head{display:flex;justify-content:space-between;border-bottom:2px solid #171717;padding-bottom:14px;margin-bottom:25px}.print-logo{font-weight:800;font-size:24px}.print-meta{font-size:10px;color:#666;text-align:right}.print-section{margin:20px 0}.print-section h3{font-size:13px;margin:0 0 9px}.print-section p,.print-section li{font-size:11px;line-height:1.55}.print-table{width:100%;border-collapse:collapse;font-size:10px}.print-table th,.print-table td{border:1px solid #ccc;padding:7px}.footer{margin-top:25px;color:#999;font-size:10px;text-align:center}.empty{padding:30px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;right:18px;bottom:18px;background:#171717;color:#fff;padding:11px 14px;border-radius:9px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}@media(max-width:950px){.side{width:72px}.brand strong{font-size:0}.brand strong:after{content:'P';font-size:23px}.brand small,.group-head span:first-child,.nav-item span:not(.icon){display:none}.nav-item{text-align:center}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.grid{grid-template-columns:1fr 1fr}.wide{grid-column:span 2}.doc-grid{grid-template-columns:1fr 1fr}}@media(max-width:620px){.side{width:58px;padding:12px 7px}.main{margin-left:58px;width:calc(100% - 58px);padding:12px}.top{align-items:flex-start}.company strong{display:none}.page-head{display:block}.actions{margin-top:12px}.title{font-size:25px}.grid{grid-template-columns:1fr}.wide,.full{grid-column:span 1}.pipeline{grid-template-columns:1fr 1fr}.form,.doc-grid{grid-template-columns:1fr}.card{padding:14px}.print-sheet{padding:22px;min-height:auto}.print-meta{font-size:8px}.print-logo{font-size:20px}}
@media print{body{background:#fff}.side,.top,.page-head,.footer,.no-print{display:none!important}.main{margin:0;width:100%;padding:0}.print-sheet{border:0;max-width:none;padding:25mm;min-height:0}.print-sheet *{break-inside:avoid}.print-only{display:block!important}}
</style></head>
<body><div class="app">
<aside class="side"><div class="brand"><strong>PORCELANE</strong><small>Sistema da marmoraria</small></div><nav id="nav"></nav></aside>
<main class="main"><div class="top"><div class="crumb">Porcelane / <strong id="crumb">Início</strong></div><div class="company"><span class="dot"></span><strong>Empresa</strong><span>Porcelane ▾</span></div></div><div id="content"></div></main></div><div id="toast" class="toast"></div>
<script>
const sections=[['Início',[['Dashboard','⌂']]],['Comercial',[['Clientes','◎'],['Leads','◌'],['Orçamentos','▤'],['Pedidos','▣'],['Comissões','%']]],['Técnico',[['Medição e Conferência','⌗'],['Desenho Técnico','◇'],['Aprovações','✓'],['Pendências','!']]],['Produção',[['Produção','◈'],['Acabamento','◈'],['Controle de Qualidade','✓']]],['Obra',[['Carregamento','▰'],['Entrega','→'],['Instalação','⌂'],['Termos de Aceite','▧'],['Pós-venda','↗']]],['Gestão',[['Financeiro','R$'],['Estoque','□'],['Relatórios','▥']]],['Documentos',[['Central de Arquivos','▧'],['Contratos e Termos','▤'],['Protocolos','▥'],['Modelos','□']]],['Assistente',[['Assistente PETRA','✦']]],['Configurações',[['Configurações','⚙']]]];
const demo={Clientes:[['001','Cliente Residencial','Obra A','Ativo'],['002','Cliente Corporativo','Obra B','Ativo'],['003','Cliente Arquitetura','Obra C','Negociação']],Leads:[['L001','Novo contato','Instagram','Novo'],['L002','Indicação','Arquiteto','Contato']],Orçamentos:[['ORC-104','Cliente Residencial','R$ 18.450','Em negociação'],['ORC-105','Cliente Corporativo','R$ 31.200','Enviado'],['ORC-106','Cliente Arquitetura','R$ 12.800','Aprovado']],Pedidos:[['PED-104','Cliente Residencial','Produção','10/09'],['PED-105','Cliente Corporativo','Conferência','12/09'],['PED-106','Cliente Arquitetura','Instalação','14/09']],Produção:[['PED-104','Cozinha','Corte','Em andamento'],['PED-107','Banheiro','Acabamento','Aguardando']],Instalação:[['PED-106','Obra C','14/09','Agendada'],['PED-109','Obra D','16/09','A confirmar']],Financeiro:[['PAR-001','Cliente Residencial','Entrada','R$ 6.000'],['PAR-002','Cliente Corporativo','Parcela 2','R$ 8.400']],Estoque:[['M001','Mármore','12 chapas','Disponível'],['M002','Granito','8 chapas','Disponível'],['M003','Porcelanato','24 caixas','Baixo estoque']]};
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
function buildNav(){const n=document.getElementById('nav');n.innerHTML=sections.map((s,i)=>`<div class="group ${i>0?'collapsed':''}"><button class="group-head" onclick="this.parentElement.classList.toggle('collapsed')"><span>${s[0]}</span><span class="chev">⌄</span></button><div class="group-items">${s[1].map((it,j)=>`<button class="nav-item ${it[0]==='Dashboard'?'active':''}" onclick="openPage('${it[0]}',this)"><span class="icon">${it[1]}</span><span>${it[0]}</span></button>`).join('')}</div></div>`).join('')}
function shell(title,sub,actions=''){return `<div class="page-head"><div><h1 class="title">${title}</h1><p class="subtitle">${sub}</p></div><div class="actions">${actions}</div></div>`}
function dashboard(){return shell('Visão geral','Acompanhe a operação da Porcelane.','<button class="btn primary" onclick="openPage(\'Novo Orçamento\')">+ Novo orçamento</button>')+`<section class="grid"><div class="card"><div class="kpi-label">Orçamentos em aberto</div><div class="kpi">12</div><div class="kpi-note">elaboração ou negociação</div></div><div class="card"><div class="kpi-label">Pedidos em andamento</div><div class="kpi">8</div><div class="kpi-note">acompanhamento ativo</div></div><div class="card"><div class="kpi-label">Produção</div><div class="kpi">5</div><div class="kpi-note">na fábrica</div></div><div class="card"><div class="kpi-label">Instalações próximas</div><div class="kpi">3</div><div class="kpi-note">datas previstas</div></div><div class="card wide"><h2 class="section-title">Fluxo operacional</h2><div class="pipeline"><div class="stage"><b>12</b><span>Orçamentos</span></div><div class="stage"><b>8</b><span>Pedidos</span></div><div class="stage"><b>5</b><span>Produção</span></div><div class="stage"><b>3</b><span>Instalação</span></div></div></div><div class="card wide"><h2 class="section-title">Próximas atividades</h2><div class="rows"><div class="row"><span>Conferência — Obra Residencial</span><span class="badge">Hoje</span></div><div class="row"><span>Produção — Pedido #1048</span><span class="badge">Amanhã</span></div><div class="row"><span>Instalação — Pedido #1042</span><span class="badge">10/09</span></div></div></div><div class="card full"><h2 class="section-title">Atenção</h2><div class="row"><span>2 pedidos aguardam conferência técnica.</span><button class="btn" onclick="openPage('Pendências')">Ver pendências</button></div></div></section>`}
function tablePage(name,rows){return shell(name,'Dados demonstrativos para validação da interface.','<button class="btn primary" onclick="toast(\'Novo registro preparado\')">+ Novo</button>')+`<div class="card full"><div class="table-wrap"><table class="table"><thead><tr>${['Código','Descrição','Detalhe','Status'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function docs(){const docs=['Orçamento','Termo de Adesão / Contrato','Medição e Conferência','Aprovação Técnica','Termo de Alteração','Protocolo de Carregamento','Protocolo de Entrega','Protocolo de Instalação','Termo de Aceite e Conclusão','Guia de Cuidados com a Pedra','Ordem de Produção','Relatório de Pós-venda'];return shell('Central de Documentos','Documentos prontos para visualizar e imprimir.','<button class="btn primary" onclick="printDoc(\'Orçamento\')">Imprimir documento</button>')+`<div class="doc-grid">${docs.map(d=>`<div class="doc"><b>${d}</b><p>Modelo oficial PETRA para a operação Porcelane.</p><button class="btn" onclick="printDoc('${d}')">Abrir / imprimir</button></div>`).join('')}</div>`}
function printDoc(type){document.getElementById('content').innerHTML=`<div class="print-sheet"><div class="print-head"><div class="print-logo">PORCELANE</div><div class="print-meta">PETRA — Documento operacional<br>Modelo: ${esc(type)}<br>Versão 1.0 • Página 1</div></div><div class="print-section"><h3>${esc(type)}</h3><p>Documento gerado pelo sistema da marmoraria. O layout pertence ao PETRA; os dados abaixo pertencem à Porcelane e serão preenchidos pelo sistema.</p></div><div class="print-section"><h3>Cliente / Obra</h3><table class="print-table"><tr><th>Cliente</th><td>Cliente demonstrativo</td><th>Pedido</th><td>PED-104</td></tr><tr><th>Obra</th><td>Obra Residencial</td><th>Data</th><td>08/09/2026</td></tr><tr><th>Ambiente</th><td>Cozinha</td><th>Responsável</th><td>Porcelane</td></tr></table></div><div class="print-section"><h3>Registro / Condições</h3><table class="print-table"><tr><th>Descrição</th><th>Quantidade</th><th>Observação</th></tr><tr><td>Serviço / material</td><td>1</td><td>Registro demonstrativo para validação.</td></tr><tr><td>Beneficiamento / acabamento</td><td>Conforme pedido</td><td>Detalhamento interno.</td></tr></table></div><div class="print-section"><h3>Observações</h3><p>Espaço destinado às informações específicas do processo.</p><p>Este modelo é operacional e deve ser juridicamente revisado antes de uso contratual definitivo.</p></div><div style="margin-top:80px;display:flex;justify-content:space-between;font-size:10px"><span>Responsável: __________________________</span><span>Cliente: __________________________</span></div><div class="footer">PETRA • Porcelane • Documento operacional • Versão 1.0</div></div>`;document.getElementById('crumb').textContent='Documentos / '+type;setTimeout(()=>window.print(),150)}
function formPage(title){return shell(title,'Cadastre e valide o fluxo pela interface.','<button class="btn" onclick="openPage(\'Dashboard\')">Cancelar</button><button class="btn primary" onclick="toast(\'Registro salvo na demonstração\')">Salvar</button>')+`<div class="card"><div class="notice">Modo de demonstração: os campos permitem testar a experiência no celular e no computador. A persistência real será conectada ao banco na próxima etapa.</div><div class="form"><div class="field"><label>Cliente</label><input placeholder="Nome do cliente"></div><div class="field"><label>Obra</label><input placeholder="Nome da obra"></div><div class="field"><label>Ambiente</label><input placeholder="Cozinha, banheiro..." ></div><div class="field"><label>Status</label><select><option>Novo</option><option>Em andamento</option><option>Aguardando</option><option>Concluído</option></select></div><div class="field"><label>Data prevista</label><input type="date"></div><div class="field"><label>Responsável</label><input placeholder="Responsável"></div><div class="field" style="grid-column:1/-1"><label>Observações</label><textarea placeholder="Informações do processo"></textarea></div></div></div>`}
function openPage(name,el){if(el){document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));el.classList.add('active')}document.getElementById('crumb').textContent=name;let html;if(name==='Dashboard')html=dashboard();else if(name==='Central de Arquivos'||name==='Contratos e Termos'||name==='Protocolos'||name==='Modelos')html=docs();else if(['Clientes','Leads','Orçamentos','Pedidos','Produção','Instalação','Financeiro','Estoque'].includes(name))html=tablePage(name,demo[name]);else if(name==='Novo Orçamento'||name==='Novo Pedido'||name==='Medição e Conferência'||name==='Desenho Técnico'||name==='Configurações')html=formPage(name);else html=shell(name,'Área operacional da Porcelane.')+`<div class="card empty">Tela preparada para o processo de ${name}.<br><br><button class="btn primary" onclick="toast('Fluxo demonstrativo iniciado')">Iniciar fluxo</button></div>`;document.getElementById('content').innerHTML=html;window.scrollTo({top:0,behavior:'smooth'})}
buildNav();openPage('Dashboard');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
