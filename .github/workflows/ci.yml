name: PETRA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: petra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d petra_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run migrate
        env:
          PETRA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petra_test
      - run: npm test
        env:
          PETRA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/petra_test
